<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <script>
    (function applyStoredTheme() {
      try {
        const storageKey = 'sudoku-theme';
        const savedTheme = localStorage.getItem(storageKey);
        const prefersDarkTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDarkTheme ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <h1>Sudoku Game</h1>
  <div id="sudoku-board"></div>
  <div class="controls">
    <label for="difficulty-select">Difficulty:</label>
    <select id="difficulty-select">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>
    <label for="player-name">Player:</label>
    <input id="player-name" type="text" maxlength="20" placeholder="Your name" value="Player" />
    <button id="theme-toggle" type="button" aria-label="Toggle dark mode">Dark Mode</button>
    <button id="new-game">New Game</button>
    <button id="hint-button">Hint</button>
    <button id="check-solution">Check Solution</button>
    <span id="timer-display" aria-live="polite">Time: 00:00</span>
    <span id="message"></span>
    <span id="hints-used" style="margin-left:12px">Hints used: 0</span>
  </div>

  <div id="leaderboard-panel" aria-live="polite">
    <h2>Top 10 Scores</h2>
    <ol id="leaderboard-list"></ol>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
